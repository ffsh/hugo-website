name: Build and deploy Hugo site

on:
  push:
    branches:
      - main
  workflow_dispatch:

concurrency:
  group: deploy-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build:
    name: Build site
    runs-on: ubuntu-latest
    permissions:
      contents: read
    env:
      HUGO_BASE_URL: >-
        ${{ (github.event_name == 'workflow_dispatch' || github.ref == 'refs/heads/main') && 'https://beta.freifunk-suedholstein.de/' || secrets.PRODUCTION_BASE_URL || 'https://freifunk-suedholstein.de/' }}

    steps:
      - name: Checkout repository
        uses: actions/checkout@v7

      - name: Setup Hugo
        uses: peaceiris/actions-hugo@2752ce1d29631191ea3f27c23495fa06139a5b78 #v3.2.1
        with:
          hugo-version: 0.166.0
          extended: true

      - name: Write build metadata
        env:
          GITHUB_REPO: ${{ github.server_url }}/${{ github.repository }}
          GIT_COMMIT_SHA: ${{ github.sha }}
        run: |
          cat > .build-metadata.yaml <<EOF
          params:
            githubRepo: "${GITHUB_REPO}"
            gitCommit: "${GIT_COMMIT_SHA}"
          EOF

      - name: Build website
        run: hugo --gc --minify --baseURL "$HUGO_BASE_URL" --config hugo.yaml,.build-metadata.yaml

      - name: Upload build artifact
        uses: actions/upload-artifact@v7
        with:
          name: public
          path: ./public
          if-no-files-found: error

  deploy:
    name: Deploy via SSH
    needs: build
    if: github.ref == 'refs/heads/main' && (github.event_name == 'push' || github.event_name == 'workflow_dispatch')
    runs-on: ubuntu-latest

    steps:
      - name: Download build artifact
        uses: actions/download-artifact@v8
        with:
          name: public
          path: ./public

      - name: Configure SSH
        uses: webfactory/ssh-agent@e83874834305fe9a4a2997156cb26c5de65a8555 #v0.10.0
        with:
          ssh-private-key: ${{ secrets.DEPLOY_SSH_PRIVATE_KEY }}

      - name: Add server to known_hosts
        env:
          DEPLOY_HOST: ${{ secrets.DEPLOY_HOST }}
          DEPLOY_PORT: ${{ secrets.DEPLOY_PORT || 22 }}
        run: |
          mkdir -p ~/.ssh
          ssh-keyscan -p "$DEPLOY_PORT" "$DEPLOY_HOST" >> ~/.ssh/known_hosts

      - name: Deploy static site to server
        env:
          DEPLOY_HOST: ${{ secrets.DEPLOY_HOST }}
          DEPLOY_PORT: ${{ secrets.DEPLOY_PORT || 22 }}
          DEPLOY_USER: ${{ secrets.DEPLOY_USER }}
          DEPLOY_PATH: ${{ secrets.DEPLOY_PATH }}
        run: |
          ssh -p "$DEPLOY_PORT" "$DEPLOY_USER@$DEPLOY_HOST" "mkdir -p '$DEPLOY_PATH'"
          rsync -avz --delete -e "ssh -p $DEPLOY_PORT" ./public/ "$DEPLOY_USER@$DEPLOY_HOST:$DEPLOY_PATH/"

<header class="site-header">
  <div class="container header-inner">
    <a class="brand" href="{{ site.Home.RelPermalink }}" title="{{ site.Title }}" aria-label="{{ site.Title }}">
      <img src="{{ "/logo/Freifunk-Suedholstein-Logo_mid.webp" | relURL }}" alt="{{ site.Title }}" class="brand-logo">
      <span class="brand-text">{{ site.Title }}</span>
    </a>

    <div class="header-tools">
      <a class="rss-link" href="{{ "feed.xml" | absURL }}" aria-label="{{ i18n "rss_subscribe" }}" title="{{ i18n "rss_subscribe" }}">
        <svg viewBox="0 0 24 24" aria-hidden="true" focusable="false">
          <path d="M4 11a9 9 0 0 1 9 9"></path>
          <path d="M4 4a16 16 0 0 1 16 16"></path>
          <circle cx="5" cy="19" r="1.7"></circle>
        </svg>
      </a>

      <div class="search-shell">
        <button class="search-toggle" type="button" aria-label="{{ i18n "search_button" }}" aria-expanded="false" aria-controls="site-search-form">
          <svg viewBox="0 0 24 24" aria-hidden="true" focusable="false">
            <circle cx="11" cy="11" r="5.8"></circle>
            <path d="M16 16L21 21"></path>
          </svg>
        </button>

        <form id="site-search-form" class="search-form" action="{{ "search" | absURL }}" method="get" role="search">
          <label class="sr-only" for="site-search">{{ i18n "search_label" }}</label>
          <input id="site-search" name="q" type="search" placeholder="{{ i18n "search_placeholder" }}" aria-label="{{ i18n "search_in_blog" }}">
          <button type="submit" aria-label="{{ i18n "search_button" }}">{{ i18n "search_button" }}</button>
        </form>
      </div>

      <button class="theme-toggle" type="button" aria-label="{{ i18n "theme_toggle_dark" }}" aria-pressed="false" data-light-label="{{ i18n "theme_toggle_light" }}" data-dark-label="{{ i18n "theme_toggle_dark" }}">
        <span aria-hidden="true">☀️</span>
      </button>
    </div>

    <button class="nav-toggle" type="button" aria-label="{{ i18n "nav_open" }}" aria-expanded="false" aria-controls="main-menu">
      <span></span>
      <span></span>
      <span></span>
    </button>
  </div>

  <div class="container header-nav-wrap">
    <div id="main-menu" class="header-actions">
      <nav class="main-nav" aria-label="{{ i18n "nav_label" }}">
        {{ $currentPage := . }}
        {{ range site.Menus.main }}
          <a href="{{ .URL | relURL }}" class="nav-link {{ if or ($currentPage.IsMenuCurrent "main" .) ($currentPage.HasMenuCurrent "main" .) }}active{{ end }}">
            {{ .Name }}
          </a>
        {{ end }}
      </nav>
    </div>
  </div>
</header>

<script>
  document.addEventListener('DOMContentLoaded', function () {
    const root = document.documentElement;
    const header = document.querySelector('.site-header');
    const toggle = document.querySelector('.nav-toggle');
    const menu = document.getElementById('main-menu');
    const themeToggle = document.querySelector('.theme-toggle');
    const searchShell = document.querySelector('.search-shell');
    const searchToggle = document.querySelector('.search-toggle');
    const searchForm = document.getElementById('site-search-form');

    if (themeToggle) {
      const setTheme = (theme) => {
        root.setAttribute('data-theme', theme);
        const darkMode = theme === 'dark';
        const lightLabel = themeToggle.dataset.lightLabel || 'Enable light mode';
        const darkLabel = themeToggle.dataset.darkLabel || 'Enable dark mode';
        themeToggle.setAttribute('aria-pressed', String(darkMode));
        themeToggle.setAttribute('aria-label', darkMode ? lightLabel : darkLabel);
        themeToggle.innerHTML = darkMode ? '<span aria-hidden="true">☀️</span>' : '<span aria-hidden="true">🌙</span>';
        localStorage.setItem('theme', theme);
      };

      const savedTheme = localStorage.getItem('theme');
      const prefersDark = window.matchMedia('(prefers-color-scheme: dark)').matches;
      setTheme(savedTheme || (prefersDark ? 'dark' : 'light'));

      themeToggle.addEventListener('click', function () {
        const nextTheme = root.getAttribute('data-theme') === 'dark' ? 'light' : 'dark';
        setTheme(nextTheme);
      });
    }

    if (searchToggle && searchForm && searchShell) {
      const closeSearch = () => {
        searchShell.classList.remove('search-open');
        searchToggle.setAttribute('aria-expanded', 'false');
      };

      searchToggle.addEventListener('click', function () {
        const isOpen = searchShell.classList.toggle('search-open');
        searchToggle.setAttribute('aria-expanded', String(isOpen));
        if (isOpen) {
          const input = searchForm.querySelector('input');
          if (input) {
            setTimeout(function () {
              input.focus();
            }, 50);
          }
        }
      });

      searchForm.addEventListener('submit', closeSearch);

      document.addEventListener('click', function (event) {
        if (!searchShell.contains(event.target)) {
          closeSearch();
        }
      });
    }

    if (!header || !toggle || !menu) {
      return;
    }

    const closeMenu = () => {
      header.classList.remove('menu-open');
      toggle.setAttribute('aria-expanded', 'false');
      toggle.setAttribute('aria-label', '{{ i18n "nav_open" }}');
    };

    toggle.addEventListener('click', function () {
      const isOpen = header.classList.toggle('menu-open');
      toggle.setAttribute('aria-expanded', String(isOpen));
      toggle.setAttribute('aria-label', isOpen ? '{{ i18n "nav_close" }}' : '{{ i18n "nav_open" }}');
    });

    menu.querySelectorAll('a').forEach(function (link) {
      link.addEventListener('click', closeMenu);
    });

    document.addEventListener('click', function (event) {
      if (!header.contains(event.target)) {
        closeMenu();
      }
    });
  });
</script>
